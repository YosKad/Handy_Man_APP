name: backend

on:
  push:
    branches: ["**"]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # CI never talks to a real provider: the fake adapter exercises the whole
      # pipeline deterministically and for free.
      ENVIRONMENT: test
      AI_PROVIDER: fake
      SECRET_KEY: ci-secret-key-not-used-outside-continuous-integration
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check --output-format=github .
          ruff format --check .

      - name: Type check
        run: mypy app tests

      - name: Architecture guards
        run: python scripts/check_architecture.py

      - name: Tests
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  integration:
    # Runs the suite against real Postgres and Redis. Split from `quality` so a
    # lint failure reports in seconds rather than after services boot.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: handyai
          POSTGRES_PASSWORD: handyai
          POSTGRES_DB: handyai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U handyai"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ENVIRONMENT: test
      AI_PROVIDER: fake
      SECRET_KEY: ci-secret-key-not-used-outside-continuous-integration
      DATABASE_URL: postgresql+asyncpg://handyai:handyai@localhost:5432/handyai_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Integration tests
        # Exit code 5 means "nothing collected". Integration tests arrive with the
        # persistence layer; until then an empty selection is a pass, not a failure.
        run: |
          set +e
          pytest -m integration
          status=$?
          set -e
          if [ "$status" -eq 5 ]; then
            echo "no integration tests selected yet"
            exit 0
          fi
          exit "$status"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
