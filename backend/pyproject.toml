[project]
name = "handyai-backend"
version = "0.1.0"
description = "HandyAI backend — AI-powered handyman assistant"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3",
    "redis>=5.2",
    "celery>=5.4",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "python-multipart>=0.0.17",
    "httpx>=0.27",
    "pillow>=11.0",
    "email-validator>=2.2",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-redis",
    "asgi-lifespan>=2.1",
]
openai = ["openai>=1.57"]
anthropic = ["anthropic>=0.40"]
gemini = ["google-genai>=0.3"]
monitoring = ["sentry-sdk[fastapi]>=2.19", "prometheus-client>=0.21"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "TID",      # tidy imports
    "RUF",      # ruff-specific
    "ASYNC",    # async correctness
    "S",        # bandit (security)
    "DTZ",      # timezone-aware datetimes
    "PT",       # pytest style
    "ANN",      # type annotations
]
ignore = [
    "ANN401",   # allow typing.Any where deliberately dynamic
    "B008",     # FastAPI Depends() in defaults is the idiom
    # Our error classes are named after the *condition* they represent
    # (NotFound, Forbidden, ConfidenceTooLow) to mirror the API error codes in
    # docs/04. Forcing an "Error" suffix would make the codes read worse.
    "N818",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, construct settings with dummy secrets, and skip return annotations.
"tests/*" = ["S101", "S105", "S106", "ANN201", "ANN001"]
"alembic/*" = ["ANN", "E501", "S"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["celery.*", "pgvector.*", "argon2.*"]
ignore_missing_imports = true

# Provider SDKs are optional extras and are deliberately absent from CI, which
# runs the `fake` adapter. Their adapters must still type-check in both states,
# so ignores that are needed with the SDK installed are tolerated without it.
[[tool.mypy.overrides]]
module = ["openai.*", "anthropic.*", "google.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.infrastructure.ai.adapters.openai_adapter"]
warn_unused_ignores = false

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires Postgres and Redis from docker-compose",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/infrastructure/ai/adapters/openai_adapter.py", "*/alembic/*"]

[tool.coverage.report]
skip_empty = true
